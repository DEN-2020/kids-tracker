name: Firebase Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: Deploy Cloud Functions too
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_USE_FIREBASE_FUNCTIONS: ${{ vars.VITE_USE_FIREBASE_FUNCTIONS != '' && vars.VITE_USE_FIREBASE_FUNCTIONS || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate deploy environment
        run: |
          missing=0
          for key in FIREBASE_SERVICE_ACCOUNT_JSON VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing required GitHub secret/variable: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify app and functions
        run: npm run verify:all

      - name: Install functions dependencies
        if: ${{ inputs.deploy_functions }}
        working-directory: functions
        run: npm ci

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase
        run: |
          if [ "${{ inputs.deploy_functions }}" = "true" ]; then
            firebase deploy --project "$VITE_FIREBASE_PROJECT_ID" --only hosting,functions,firestore:rules,firestore:indexes,storage
          else
            firebase deploy --project "$VITE_FIREBASE_PROJECT_ID" --only hosting,firestore:rules,firestore:indexes,storage
          fi
